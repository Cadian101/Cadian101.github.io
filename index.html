    <form action="#" id="registerForm">
      <label for="emailField">Email</label>
      <input type="email" name="email" id="emailField">
      <label for="passwordField"></label>
      <input type="password" name="password" id="passwordField">
      <label for="agreementCheckbox">Agree</label>
      <input type="checkbox" name="agreement" id="agreementCheckbox">
      <label for="countryDropdown">Country</label>
      <select name="countries" id="countryDropdown">
        <option value="Ukraine">Ukraine</option>
        <option value="Other">Other</option>
      </select>
      <input type="submit" placeholder="Submit">
    </form>
    <script>
      function trackRegisterError(description, email) {
        gtag('event', 'register_error', {
          'error_description': description,
          'user_email': email || 'N/A'
        });
      }
    
      document.querySelector('#registerForm').addEventListener('submit', function(event) {
        var email = document.querySelector('#emailField').value;
        var password = document.querySelector('#passwordField').value;
        var agreement = document.querySelector('#agreementCheckbox').checked;
        var country = document.querySelector('#countryDropdown').value;
        
        if (!password) {
          event.preventDefault();
          trackRegisterError('пароль не введений', null);
        } else if (!agreement) {
          event.preventDefault();
          trackRegisterError('поле не заповнено', null);
        } else if (!country) {
          event.preventDefault();
          trackRegisterError('країна не обрана', null);
        } else if (!email) {
          event.preventDefault();
          trackRegisterError('користувач з таким емейлом вже існує', email);
        }
      });
    </script>
